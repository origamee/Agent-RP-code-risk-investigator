services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2

    depends_on:
      redpanda:
        condition: service_healthy

    command:
      - topic
      - create
      - github-push-events
      - code-risk-results
      - --if-not-exists
      - -X
      - brokers=redpanda:9092

  connect:
    image: docker.redpanda.com/redpandadata/connect:latest
    depends_on:
      topic-init:
        condition: service_completed_successfully
    volumes:
      - ./connect/connect.yaml:/connect.yaml
    command: ["run", "/connect.yaml"]

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull llama3.2:3b"]
  
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile

    restart: on-failure
    
    depends_on:
      topic-init:
        condition: service_completed_successfully

      ollama-init:
        condition: service_completed_successfully

    environment:
      REDPANDA_BROKERS: redpanda:9092
      OLLAMA_URL: http://ollama:11434
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    
  serve:
    build:
      context: .
      dockerfile: serve/Dockerfile

    depends_on:
      topic-init:
        condition: service_completed_successfully

    environment:
      REDPANDA_BROKERS: redpanda:9092

    ports:
      - "8000:8000"

volumes:
  ollama_data: